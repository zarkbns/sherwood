[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.lint]
exclude_lints = [
    "unsafe-typecast",
    "block-timestamp",
    "erc20-unchecked-transfer",
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
